<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ollama Library</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161715;color:#efeee8;font:15px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:40px 24px 64px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:32px}h1{font-size:clamp(26px,4vw,40px);letter-spacing:-1.5px;line-height:1.15;margin:8px 0}h2{font-size:20px}p{color:#aaa99f}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:#aaa99f}button{min-height:44px;padding:10px 18px;border:1px solid #45463f;border-radius:8px;background:#252720;color:#f1f0e8;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d7cbaf;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.model{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:22px 0;border-top:1px solid #35362f}.model h2{font-size:17px;margin:0;overflow-wrap:anywhere}.model p{margin:6px 0 0;font-size:12px}.model button{font-size:13px}#status{padding:14px 0}#details{margin-top:24px;padding:24px;background:#20221d;border:1px solid #35362f;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#c6c7bb}footer{border-top:1px solid #35362f;margin-top:40px;padding-top:18px;font-size:12px;color:#aaa99f}@media(max-width:520px){main{padding:24px 20px}header{align-items:flex-start;gap:12px}.model{gap:12px}.model button{padding:8px 12px}}@media(hover:hover){button:hover{background:#30332a}}
</style></head><body><main>
<header><div><span class="eyebrow">Your connected server</span><h1>Model library</h1><p id="server">Ollama · Read-only access</p></div><button id="refresh" disabled>Refresh</button></header>
<p id="status" role="status">Connecting to Vela…</p><section id="models" aria-label="Installed models"></section>
<section id="details" hidden><h2 id="modelName"></h2><pre id="modelInfo"></pre></section>
<footer>Ollama runs independently. Disconnecting or removing this app leaves the server and its models in place.</footer>
</main><script src="_vela/sdk.js"></script><script>
const status = document.getElementById('status'), list = document.getElementById('models'), refresh = document.getElementById('refresh');
let busy = false, connected = false;
async function load() {
  if (busy) return; busy = true; refresh.disabled = true;
  try {
    const connection = await Vela.connections.status(); connected = connection.connected;
    list.replaceChildren(); document.getElementById('details').hidden = true;
    if (!connected) { status.textContent = 'Connect your existing server using the Vela connection controls above.'; return; }
    const [version, result] = await Promise.all([Vela.connections.invoke('server.version'), Vela.connections.invoke('models.list')]);
    document.getElementById('server').textContent = `Ollama ${version.version} · ${connection.endpoint}`;
    status.textContent = result.models.length ? `${result.models.length} installed models` : 'This Ollama server has no installed models.';
    for (const model of result.models) {
      const row = document.createElement('article'); row.className = 'model';
      const content = document.createElement('div'), title = document.createElement('h2'), meta = document.createElement('p'), button = document.createElement('button');
      title.textContent = model.name;
      meta.textContent = `${(model.size / 1024 ** 3).toFixed(2)} GiB · ${model.details?.parameter_size || 'Size unspecified'} · ${model.details?.quantization_level || 'Quantization unspecified'}`;
      button.textContent = 'View details'; button.setAttribute('aria-label', 'View details for ' + model.name);
      button.onclick = async () => {
        button.disabled = true;
        try {
          const detail = await Vela.connections.invoke('models.show', { model: model.name });
          document.getElementById('modelName').textContent = model.name;
          document.getElementById('modelInfo').textContent = JSON.stringify(detail, null, 2);
          document.getElementById('details').hidden = false;
        } catch (error) { status.textContent = error.message; }
        finally { button.disabled = false; }
      };
      content.append(title, meta); row.append(content, button); list.append(row);
    }
  } catch (error) { status.textContent = error.message; }
  finally { busy = false; refresh.disabled = false; }
}
Vela.ready.then(load).catch(error => { status.textContent = error.message; });
refresh.onclick = load;
setInterval(() => { if (!connected && Vela.context) load(); }, 3000);
</script></body></html>
